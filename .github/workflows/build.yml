name: Build
run-name: Build ${{ inputs.version || github.ref_name }}

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version; leave empty to read cmd/mirasim/main.go'
        type: string
        required: false

permissions:
  contents: read

env:
  PLUGIN_ID: mirasim

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve build version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          REQUESTED_VERSION="${REQUESTED_VERSION#v}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ -n "${REQUESTED_VERSION}" && "${REQUESTED_VERSION}" != "${VERSION}" ]]; then
              echo '::error::Requested version must match the release tag'
              exit 1
            fi
          elif [[ -n "${REQUESTED_VERSION}" ]]; then
            VERSION="${REQUESTED_VERSION}"
          else
            VERSION="$(sed -nE 's/^var pluginVersion = "([^"]+)"$/\1/p' cmd/mirasim/main.go)"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+(\.[0-9]+)+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo '::error::Invalid or missing plugin build version'
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Build version: ${VERSION}"

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: python3 scripts/plugin_store.py validate-tag --tag "$GITHUB_REF_NAME" --allow-prerelease

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p 'test_plugin_store.py' -v

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.test.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          echo "LIB_NAME=${PLUGIN_ID}.${{ matrix.ext }}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_NAME=${PLUGIN_ID}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" >> "${GITHUB_ENV}"

      - name: Build shared library
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildmode=c-shared \
              -ldflags "-s -w -X main.pluginVersion=${VERSION}" \
              -o "dist/${LIB_NAME}" ./cmd/mirasim
          rm -f "dist/${PLUGIN_ID}.h"

      - name: Package plugin
        run: |
          set -euo pipefail
          go run ./.github/scripts/package-release.go \
            -library "dist/${LIB_NAME}" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  build-windows-arm64:
    name: Build windows/arm64
    needs: test
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.test.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release metadata
        id: release_metadata
        run: |
          set -euo pipefail
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "ARCHIVE_NAME=${PLUGIN_ID}_${VERSION}_windows_arm64.zip" >> "${GITHUB_ENV}"

      - name: Build Windows ARM64 shared library
        timeout-minutes: 45
        uses: go-cross/cgo-actions@v1
        env:
          GOFLAGS: -trimpath -buildmode=c-shared
        with:
          dir: .
          packages: ./cmd/mirasim
          targets: windows-arm64
          out-dir: dist/windows-arm64
          output: ${{ env.PLUGIN_ID }}.dll
          flags: -ldflags=-s -w
          x-flags: main.pluginVersion=${{ steps.release_metadata.outputs.version }}

      - name: Package plugin
        run: |
          set -euo pipefail
          rm -f go-cross-bin.h "dist/windows-arm64/${PLUGIN_ID}.h"
          go run ./.github/scripts/package-release.go \
            -library "dist/windows-arm64/${PLUGIN_ID}.dll" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  build-freebsd:
    name: Build freebsd/amd64
    needs: test
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.test.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release metadata
        id: release_metadata
        run: |
          set -euo pipefail
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "ARCHIVE_NAME=${PLUGIN_ID}_${VERSION}_freebsd_amd64.zip" >> "${GITHUB_ENV}"

      - name: Install FreeBSD cross-build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld wget

      - name: Fetch FreeBSD sysroot
        timeout-minutes: 15
        env:
          FREEBSD_RELEASE: 14.3-RELEASE
        run: |
          set -euo pipefail
          # download.freebsd.org only carries supported releases; once a release is
          # retired it moves to archive.freebsd.org, so try both before failing.
          for base in \
            "https://download.freebsd.org/releases/amd64/${FREEBSD_RELEASE}" \
            "https://archive.freebsd.org/old-releases/amd64/${FREEBSD_RELEASE}"; do
            if wget -q --tries=3 -O base.txz "${base}/base.txz"; then
              echo "Fetched sysroot from ${base}"
              break
            fi
            rm -f base.txz
          done
          test -s base.txz
          mkdir -p "${RUNNER_TEMP}/freebsd-sysroot"
          sudo tar -xf base.txz -C "${RUNNER_TEMP}/freebsd-sysroot"
          rm -f base.txz

      - name: Build FreeBSD shared library
        timeout-minutes: 45
        env:
          FREEBSD_TARGET: x86_64-unknown-freebsd14.3
        run: |
          set -euo pipefail
          mkdir -p dist/freebsd-amd64
          CGO_ENABLED=1 GOOS=freebsd GOARCH=amd64 \
            CC="clang --target=${FREEBSD_TARGET} --sysroot=${RUNNER_TEMP}/freebsd-sysroot" \
            CGO_LDFLAGS=-fuse-ld=lld \
            go build -trimpath -buildmode=c-shared \
              -ldflags "-s -w -X main.pluginVersion=${VERSION}" \
              -o "dist/freebsd-amd64/${PLUGIN_ID}.so" \
              ./cmd/mirasim

      - name: Package plugin
        run: |
          set -euo pipefail
          rm -f go-cross-bin.h "dist/freebsd-amd64/${PLUGIN_ID}.h"
          go run ./.github/scripts/package-release.go \
            -library "dist/freebsd-amd64/${PLUGIN_ID}.so" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs:
      - build
      - build-windows-arm64
      - build-freebsd
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mirasim_*.zip
          path: dist
          merge-multiple: true

      - name: Validate release assets
        run: python3 scripts/plugin_store.py verify-release --tag "$GITHUB_REF_NAME" --directory dist --allow-prerelease

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check checksums.txt)
          release_flags=()
          release_notes="Automated release for ${GITHUB_REF_NAME}."
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
            release_notes="Development preview for ${GITHUB_REF_NAME}. See README for known limitations."
          fi
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              gh release edit "${GITHUB_REF_NAME}" "${release_flags[@]}" --repo "${GITHUB_REPOSITORY}"
            fi
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes "${release_notes}" \
              "${release_flags[@]}"
          fi
